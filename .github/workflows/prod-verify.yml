name: Prod Verify

# On-demand, read-only production verification run from a GitHub runner.
# Used to gate the one-at-a-time sprint merges (10/10): optionally waits for a
# specific commit to be live (via /api/version), then checks the homepage, the
# health endpoints, the public SEO routes and the 404 behaviour. Never writes
# anything; fails loudly with ::error annotations.

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Base URL to verify'
        required: false
        default: 'https://getcarelinkai.com'
      expect_sha:
        description: 'Wait until /api/version commitSha starts with this (empty = do not wait)'
        required: false
        default: ''
      wait_minutes:
        description: 'Max minutes to wait for expect_sha'
        required: false
        default: '20'
      check_public_routes:
        description: '/cleveland/* → 200 indexable, /zzz-nope + /.env → 404 (post-#714)'
        type: boolean
        required: false
        default: true
      check_ping:
        description: '/api/ping → 200 (post-#715)'
        type: boolean
        required: false
        default: false
      check_v1020:
        description: '10/20 batch: footer sha on /cleveland/assisted-living (OL-159, dumps headers on mismatch), ≥ expect_listing_cards cards, a suburb page, a listing page, /llms.txt + listing JSON-LD expose availabilityVerifiedAt, /concierge server HTML + both lanes in a browser'
        type: boolean
        required: false
        default: false
      check_post_405:
        description: 'POST / → 405 with Allow header (post-#759 / OL-161)'
        type: boolean
        required: false
        default: false
      expect_listing_cards:
        description: 'Expected listing-card count on /cleveland/assisted-living (empty = skip)'
        required: false
        default: ''
      check_concierge:
        description: '/concierge → 200 with the screener; one /homes/<id> listing page → 200 (W5 merge gate)'
        type: boolean
        required: false
        default: false
      footer_pages:
        description: 'Space-separated paths: each → 200 and its footer sha = expect_sha (empty = skip)'
        required: false
        default: ''
      sitemap_paths:
        description: 'Space-separated paths that must be listed in /sitemap.xml (empty = skip)'
        required: false
        default: ''
      mobile_overflow_paths:
        description: 'OL-227: space-separated paths checked in a mobile browser (390×844, 375×667): page never wider than the device (empty = skip)'
        required: false
        default: ''
      mobile_overflow_home_name:
        description: 'OL-227: a listing name to find via /cleveland/assisted-living + suburb pages and check the same way (empty = skip)'
        required: false
        default: ''
      check_auth:
        description: 'OL-231: /auth/login, /auth/register, /auth/forgot-password → 200; GET /api/auth/providers + /api/auth/csrf answer normally; a credentials sign-in POST with an unknown (reserved .invalid) email gets the normal failure, not a 5xx. Read-only.'
        type: boolean
        required: false
        default: false
      check_trackers:
        description: 'OL-228/229: /, /search?q=test, one /homes/<id> and /concierge load zero scripts or requests from facebook.net, clarity.ms, googletagmanager.com, google-analytics.com (analytics consent granted; /api/analytics/track blocked so nothing is written); /admin/analytics/funnel answers without a server error'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: prod-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify
        shell: bash
        env:
          BASE: ${{ inputs.base }}
          EXPECT_SHA: ${{ inputs.expect_sha }}
          WAIT_MINUTES: ${{ inputs.wait_minutes }}
          CHECK_PUBLIC: ${{ inputs.check_public_routes }}
          CHECK_PING: ${{ inputs.check_ping }}
          CHECK_1020: ${{ inputs.check_v1020 }}
          CHECK_405: ${{ inputs.check_post_405 }}
          EXPECT_CARDS: ${{ inputs.expect_listing_cards }}
          CHECK_CONCIERGE: ${{ inputs.check_concierge }}
          FOOTER_PAGES: ${{ inputs.footer_pages }}
          SITEMAP_PATHS: ${{ inputs.sitemap_paths }}
        run: |
          # GitHub's default shell is `bash -e -o pipefail`; this script collects
          # failures itself, so turn errexit/pipefail OFF (a grep with no match
          # must not abort the run).
          set +e +o pipefail
          set -u
          FAIL=0
          fail() { echo "::error::$1"; echo "- ❌ $1" >> "$GITHUB_STEP_SUMMARY"; FAIL=1; }
          pass() { echo "OK: $1"; echo "- ✅ $1" >> "$GITHUB_STEP_SUMMARY"; }

          # fetch PATH -> sets CODE, LOC (redirect target), ROBOTS (x-robots-tag), BODY file
          fetch() {
            local method="$1" path="$2"
            : > headers.txt; : > body.txt
            CODE=$(curl -s -m 40 -X "$method" -o body.txt -D headers.txt -w '%{http_code}' \
                     -A 'CareLinkAI-ProdVerify/1.0 (+github-actions)' "$BASE$path" || echo 000)
            LOC=$( { grep -i '^location:' headers.txt || true; } | head -n1 | sed -E 's/^[Ll]ocation:[[:space:]]*//; s/\r$//')
            ROBOTS=$( { grep -i '^x-robots-tag:' headers.txt || true; } | head -n1 | sed -E 's/^[Xx]-[Rr]obots-[Tt]ag:[[:space:]]*//; s/\r$//')
          }

          echo "## Prod verify — $BASE" >> "$GITHUB_STEP_SUMMARY"

          # ---- 0. wait for the expected commit ---------------------------------
          if [ -n "$EXPECT_SHA" ]; then
            deadline=$(( $(date +%s) + WAIT_MINUTES*60 ))
            while :; do
              fetch GET /api/version
              live=$( { grep -o '"commitSha":"[0-9a-f]*"' body.txt || true; } | cut -d'"' -f4)
              echo "$(date -u +%H:%M:%S) /api/version HTTP $CODE commitSha=${live:-?}"
              case "${live:-}" in
                "$EXPECT_SHA"*) pass "live commit ${live} matches expected ${EXPECT_SHA}"; break ;;
              esac
              if [ "$(date +%s)" -ge "$deadline" ]; then
                fail "expected commit $EXPECT_SHA not live after $WAIT_MINUTES min (live=${live:-?})"
                break
              fi
              sleep 30
            done
          fi

          # ---- 1. homepage + health ---------------------------------------------
          fetch GET /
          [ "$CODE" = "200" ] && pass "GET / → 200" || fail "GET / → $CODE (loc=$LOC)"

          fetch GET /api/health
          hok=$( { grep -o '"ok":[a-z]*' body.txt || true; } | cut -d: -f2)
          hdb=$( { grep -o '"db":"[a-z]*"' body.txt || true; } | cut -d'"' -f4)
          if [ "$CODE" = "200" ] && [ "$hok" = "true" ] && [ "$hdb" = "ok" ]; then
            pass "GET /api/health → 200 ok=true db=ok"
          else
            fail "GET /api/health → $CODE ok=$hok db=$hdb body=$(head -c 300 body.txt)"
          fi

          fetch GET /api/version
          echo "/api/version: $(head -c 400 body.txt)"
          echo "- ℹ️ /api/version: \`$(head -c 300 body.txt)\`" >> "$GITHUB_STEP_SUMMARY"

          if [ "$CHECK_PING" = "true" ]; then
            fetch GET /api/ping
            [ "$CODE" = "200" ] && pass "GET /api/ping → 200 ($(head -c 120 body.txt))" || fail "GET /api/ping → $CODE"
            fetch HEAD /api/ping
            [ "$CODE" = "200" ] && pass "HEAD /api/ping → 200" || fail "HEAD /api/ping → $CODE"
          fi

          # ---- 2. public SEO routes + 404s --------------------------------------
          if [ "$CHECK_PUBLIC" = "true" ]; then
            for p in /cleveland /cleveland/assisted-living /cleveland/memory-care /cleveland/independent-living /cleveland/nursing-homes; do
              fetch GET "$p"
              problems=""
              [ "$CODE" = "200" ] || problems="$problems status=$CODE"
              [ -z "$LOC" ] || problems="$problems redirect=$LOC"
              echo "$ROBOTS" | grep -qi noindex && problems="$problems x-robots-tag=$ROBOTS"
              grep -qiE '<meta[^>]+name="robots"[^>]+content="[^"]*noindex' body.txt && problems="$problems meta-noindex"
              [ -z "$problems" ] && pass "GET $p → 200, no redirect, indexable" || fail "GET $p →$problems"
            done
            for p in /zzz-nope /.env; do
              fetch GET "$p"
              [ "$CODE" = "404" ] && pass "GET $p → 404" || fail "GET $p → $CODE (loc=$LOC)"
            done
            fetch GET /operator
            case "$CODE" in
              302|307) echo "$LOC" | grep -q '/auth/login' && pass "GET /operator (logged-out) → $CODE to login" || fail "GET /operator → $CODE to $LOC" ;;
              *) fail "GET /operator (logged-out) → $CODE, expected redirect to login" ;;
            esac
          fi

          # ---- 3. W5 merge gate: listing cards, one listing page, /concierge ----
          if [ -n "$EXPECT_CARDS" ] || [ "$CHECK_CONCIERGE" = "true" ]; then
            fetch GET /cleveland/assisted-living
            cards=$(grep -o 'data-testid="listing-card"' body.txt | wc -l | tr -d ' ')
            if [ -n "$EXPECT_CARDS" ]; then
              if [ "$CODE" = "200" ] && [ "$cards" = "$EXPECT_CARDS" ]; then
                pass "GET /cleveland/assisted-living → 200 with $cards listing cards"
              else
                fail "GET /cleveland/assisted-living → $CODE with $cards listing cards (expected $EXPECT_CARDS)"
              fi
            fi
            if [ "$CHECK_CONCIERGE" = "true" ]; then
              # First server-rendered listing link → that listing page must answer 200.
              listing=$( { grep -oE 'href="/homes/[A-Za-z0-9_-]+"' body.txt || true; } | head -n1 | sed -E 's/^href="//; s/"$//')
              if [ -n "$listing" ]; then
                fetch GET "$listing"
                [ "$CODE" = "200" ] && pass "GET $listing (listing page) → 200" || fail "GET $listing (listing page) → $CODE (loc=$LOC)"
              else
                fail "no /homes/<id> link found in /cleveland/assisted-living HTML"
              fi
              fetch GET /concierge
              if [ "$CODE" = "200" ] && grep -q 'data-testid="concierge-screener"' body.txt; then
                pass "GET /concierge → 200 with the payer screener"
              else
                fail "GET /concierge → $CODE (screener present: $(grep -c 'data-testid="concierge-screener"' body.txt))"
              fi
            fi
          fi

          # ---- 3. 10/20 batch checks ---------------------------------------------
          if [ "$CHECK_1020" = "true" ]; then
            fetch GET /cleveland/assisted-living
            foot=$( { grep -oE 'main@[0-9a-f]{7}' body.txt || true; } | head -n1 | cut -d@ -f2)
            cards=$(grep -o 'data-testid="listing-card"' body.txt | wc -l | tr -d ' ')
            echo "- ℹ️ /cleveland/assisted-living footer sha: \`${foot:-?}\` · listing cards: $cards" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$EXPECT_SHA" ]; then
              case "${EXPECT_SHA}" in
                "${foot:-zzzzzzz}"*) pass "footer sha on /cleveland/assisted-living = ${foot} (matches expected)" ;;
                *)
                  fail "footer sha on /cleveland/assisted-living is ${foot:-?}, expected ${EXPECT_SHA} (OL-159 staleness)"
                  { echo '### /cleveland/assisted-living response headers (stale footer)'; echo '```'; cat headers.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                  echo "--- response headers ---"; cat headers.txt
                  ;;
              esac
            fi
            [ "$cards" -ge "${EXPECT_CARDS:-12}" ] && pass "/cleveland/assisted-living shows $cards listing cards (≥ ${EXPECT_CARDS:-12})" || fail "/cleveland/assisted-living shows $cards listing cards (< ${EXPECT_CARDS:-12})"
            # The key is emitted only for homes with a fresh, QA-approved verified date (OL-163d) — absence is a data state, not a regression.
            grep -q 'availabilityVerifiedAt' body.txt && pass "/cleveland/assisted-living JSON-LD exposes availabilityVerifiedAt" || echo "- ℹ️ /cleveland/assisted-living JSON-LD: no home on page 1 has a verified availability date yet (key appears once a call/ping is QA-approved)" >> "$GITHUB_STEP_SUMMARY"
            first=$( { grep -oE 'href="/homes/[A-Za-z0-9_-]+"' body.txt || true; } | head -n1 | sed -E 's/^href="//; s/"$//')
            if [ -n "$first" ]; then
              fetch GET "$first"
              [ "$CODE" = "200" ] && pass "GET $first (first listing) → 200" || fail "GET $first → $CODE"
              grep -q 'availabilityVerifiedAt' body.txt && pass "$first JSON-LD exposes availabilityVerifiedAt" || echo "- ℹ️ $first JSON-LD has no availabilityVerifiedAt (home not yet verified)" >> "$GITHUB_STEP_SUMMARY"
            else
              fail "no /homes/<id> link found on /cleveland/assisted-living"
            fi
            fetch GET /cleveland/assisted-living/westlake
            [ "$CODE" = "200" ] && pass "GET /cleveland/assisted-living/westlake (suburb) → 200" || fail "GET /cleveland/assisted-living/westlake → $CODE (loc=$LOC)"
            fetch GET /llms.txt
            if [ "$CODE" = "200" ] && grep -q 'availabilityVerifiedAt' body.txt; then pass "GET /llms.txt → 200 and names availabilityVerifiedAt"; else fail "GET /llms.txt → $CODE, availabilityVerifiedAt present: $(grep -c availabilityVerifiedAt body.txt)"; fi
            fetch GET /concierge
            if [ "$CODE" = "200" ] && grep -q 'data-testid="concierge-screener"' body.txt && grep -qF 'making the $5,000 mistake under pressure' body.txt && grep -qF 'or you pay nothing' body.txt; then
              pass "GET /concierge → 200 with the screener, the v2 headline and the guarantee subhead"
            else
              fail "GET /concierge → $CODE (screener: $(grep -c 'concierge-screener' body.txt), headline: $(grep -cF 'making the $5,000 mistake' body.txt), subhead: $(grep -cF 'or you pay nothing' body.txt))"
            fi
          fi

          # ---- 4. POST to a page → 405 (OL-161) -----------------------------------
          if [ "$CHECK_405" = "true" ]; then
            fetch POST /
            allow=$( { grep -i '^allow:' headers.txt || true; } | head -n1 | sed -E 's/^[Aa]llow:[[:space:]]*//; s/\r$//')
            [ "$CODE" = "405" ] && pass "POST / → 405 (Allow: ${allow:-?})" || fail "POST / → $CODE, expected 405 (Allow: ${allow:-?})"
          fi

          # ---- 5. named pages: 200 + footer sha; sitemap entries ----------------
          for p in $FOOTER_PAGES; do
            fetch GET "$p"
            foot=$( { grep -oE 'main@[0-9a-f]{7}' body.txt || true; } | head -n1 | cut -d@ -f2)
            if [ "$CODE" != "200" ]; then
              fail "GET $p → $CODE (loc=$LOC)"
            elif [ -n "$EXPECT_SHA" ] && [ "${foot:-}" != "${EXPECT_SHA:0:7}" ]; then
              fail "GET $p → 200 but footer sha is ${foot:-missing}, expected ${EXPECT_SHA:0:7}"
            else
              pass "GET $p → 200, footer @${foot:-?}"
            fi
          done
          if [ -n "$SITEMAP_PATHS" ]; then
            fetch GET /sitemap.xml
            if [ "$CODE" != "200" ]; then
              fail "GET /sitemap.xml → $CODE"
            else
              for p in $SITEMAP_PATHS; do
                grep -qF "${p}</loc>" body.txt && pass "sitemap.xml lists $p" || fail "sitemap.xml does not list $p"
              done
            fi
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Production verification FAILED"
            exit 1
          fi
          echo "All production checks passed."

      - name: /concierge renders both lanes with the guarantee text (browser)
        if: ${{ inputs.check_v1020 }}
        shell: bash
        env:
          BASE: ${{ inputs.base }}
        run: |
          set -e
          mkdir -p pw && cd pw
          npm init -y >/dev/null
          npm i playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const BASE = process.env.BASE;
          const GUARANTEE = 'No verified shortlist within 2 business days → full refund.';
          const out = [];
          let fail = false;
          const pass = (m) => out.push(`- ✅ ${m}`);
          const bad = (m) => { out.push(`- ❌ ${m}`); fail = true; console.error('::error::' + m); };
          const browser = await chromium.launch();
          const page = await browser.newPage({ userAgent: 'CareLinkAI-ProdVerify/1.0 (+github-actions)' });
          async function answer(label) {
            await page.goto(BASE + '/concierge', { waitUntil: 'domcontentloaded' });
            const screener = page.getByTestId('concierge-screener');
            await screener.waitFor({ state: 'visible', timeout: 30000 });
            await page.waitForFunction(() => document.querySelector('[data-testid="concierge-screener"]')?.getAttribute('data-hydrated') === 'true', null, { timeout: 30000 });
            await screener.getByLabel(label).check();
            await screener.getByRole('button', { name: 'Continue' }).click();
          }
          try {
            await answer(/Medicaid/);
            await page.getByTestId('concierge-free-lane').waitFor({ state: 'visible', timeout: 30000 });
            const text = await page.getByTestId('concierge-page').innerText();
            if (!(await page.getByTestId('concierge-offer').count()) && !text.includes('399')) pass('Medicaid → free lane renders, no offer, no $399');
            else bad('Medicaid lane shows the offer or a price');
            await answer(/Private funds/);
            await page.getByTestId('concierge-offer').waitFor({ state: 'visible', timeout: 30000 });
            const g = await page.getByTestId('concierge-guarantee').innerText();
            if (g.includes(GUARANTEE)) pass('Private funds → offer lane renders with the guarantee text'); else bad(`guarantee text missing: "${g}"`);
            const incl = await page.getByTestId('concierge-inclusions').locator('li').count();
            incl === 9 ? pass('offer lists the nine v2 deliverables') : bad(`offer lists ${incl} deliverables, expected 9`);
            await answer(/Not sure yet/);
            await page.getByTestId('concierge-both').waitFor({ state: 'visible', timeout: 30000 });
            pass('Not sure → both lanes render (free help first, offer second)');
          } catch (e) {
            bad(`browser check threw: ${e.message}`);
          } finally {
            await browser.close();
          }
          const fs = await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join('\n') + '\n');
          console.log(out.join('\n'));
          if (fail) process.exit(1);
          EOF
          node check.mjs

      - name: Mobile overflow — page never wider than the device (browser, OL-227)
        if: ${{ inputs.mobile_overflow_paths != '' || inputs.mobile_overflow_home_name != '' }}
        shell: bash
        env:
          BASE: ${{ inputs.base }}
          PATHS: ${{ inputs.mobile_overflow_paths }}
          HOME_NAME: ${{ inputs.mobile_overflow_home_name }}
        run: |
          set -e
          mkdir -p pwm && cd pwm
          npm init -y >/dev/null
          npm i playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const BASE = process.env.BASE;
          const out = [];
          let fail = false;
          const pass = (m) => out.push(`- ✅ ${m}`);
          const bad = (m) => { out.push(`- ❌ ${m}`); fail = true; console.error('::error::' + m); };
          const browser = await chromium.launch();
          const UA = 'CareLinkAI-ProdVerify/1.0 (+github-actions)';
          const paths = (process.env.PATHS || '').split(/\s+/).filter(Boolean);
          try {
            if (process.env.HOME_NAME) {
              // Find the listing's /homes/<id> link on the directory hub or one of its suburb pages.
              const page = await browser.newPage({ userAgent: UA });
              const name = process.env.HOME_NAME.toLowerCase();
              const findOn = async (path) => {
                await page.goto(BASE + path, { waitUntil: 'domcontentloaded' });
                return page.evaluate((n) => {
                  const a = [...document.querySelectorAll('a[href^="/homes/"]')].find((el) => (el.textContent || '').toLowerCase().includes(n));
                  return a ? a.getAttribute('href') : null;
                }, name);
              };
              let href = await findOn('/cleveland/assisted-living');
              if (!href) {
                const suburbs = await page.evaluate(() => [...new Set([...document.querySelectorAll('a[href^="/cleveland/assisted-living/"]')].map((a) => a.getAttribute('href')))]);
                for (const s of suburbs) { href = await findOn(s); if (href) break; }
              }
              if (href) { pass(`found "${process.env.HOME_NAME}" at ${href}`); paths.push(href); }
              else bad(`listing "${process.env.HOME_NAME}" not found on /cleveland/assisted-living or its suburb pages`);
              await page.close();
            }
            for (const vp of [{ width: 390, height: 844 }, { width: 375, height: 667 }]) {
              const ctx = await browser.newContext({ viewport: vp, isMobile: true, hasTouch: true, userAgent: UA });
              const page = await ctx.newPage();
              for (const p of paths) {
                await page.goto(BASE + p, { waitUntil: 'networkidle', timeout: 60000 }).catch(() => page.waitForLoadState('domcontentloaded'));
                await page.waitForTimeout(1500);
                const m = await page.evaluate(() => ({ scrollWidth: document.documentElement.scrollWidth, innerWidth: window.innerWidth }));
                const ok = m.innerWidth === vp.width && m.scrollWidth <= m.innerWidth;
                (ok ? pass : bad)(`${p} @ ${vp.width}×${vp.height}: scrollWidth ${m.scrollWidth}, innerWidth ${m.innerWidth} (device ${vp.width})`);
              }
              await ctx.close();
            }
          } catch (e) {
            bad(`mobile overflow check threw: ${e.message}`);
          } finally {
            await browser.close();
          }
          const fs = await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join('\n') + '\n');
          console.log(out.join('\n'));
          if (fail) process.exit(1);
          EOF
          node check.mjs

      - name: No third-party trackers on public pages (browser, OL-228/229)
        if: ${{ inputs.check_trackers }}
        shell: bash
        env:
          BASE: ${{ inputs.base }}
        run: |
          set -e
          mkdir -p pwt && cd pwt
          npm init -y >/dev/null
          npm i playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const BASE = process.env.BASE;
          const TRACKERS = /(^|\.)(facebook\.net|clarity\.ms|googletagmanager\.com|google-analytics\.com)$/;
          const out = [];
          let fail = false;
          const pass = (m) => out.push(`- ✅ ${m}`);
          const bad = (m) => { out.push(`- ❌ ${m}`); fail = true; console.error('::error::' + m); };
          const UA = 'CareLinkAI-ProdVerify/1.0 (+github-actions)';
          const browser = await chromium.launch();
          try {
            // Worst case: the visitor ACCEPTED analytics (and the legacy marketing flag).
            const ctx = await browser.newContext({ userAgent: UA });
            await ctx.addInitScript(() => {
              try { localStorage.setItem('carelinkai_cookie_consent', JSON.stringify({ necessary: true, analytics: true, marketing: true })); } catch {}
            });
            // Read-only run: never write funnel rows to production.
            let trackBlocked = 0;
            await ctx.route('**/api/analytics/track', (r) => { trackBlocked++; return r.abort(); });
            const page = await ctx.newPage();
            const seen = [];
            page.on('request', (r) => { try { if (TRACKERS.test(new URL(r.url()).hostname)) seen.push(r.url()); } catch {} });

            await page.goto(BASE + '/cleveland/assisted-living', { waitUntil: 'domcontentloaded' });
            const listing = await page.evaluate(() => document.querySelector('a[href^="/homes/"]')?.getAttribute('href') || null);
            if (!listing) bad('no /homes/<id> link found on /cleveland/assisted-living');
            const paths = ['/', '/search?q=test', ...(listing ? [listing] : []), '/concierge'];
            for (const p of paths) {
              const before = seen.length;
              await page.goto(BASE + p, { waitUntil: 'networkidle', timeout: 60000 }).catch(() => page.waitForLoadState('load'));
              await page.waitForTimeout(3000);
              const state = await page.evaluate(() => ({
                scripts: [...document.scripts].map((s) => s.src).filter((s) => /facebook\.net|clarity\.ms|googletagmanager\.com|google-analytics\.com/.test(s)),
                globals: ['fbq', 'clarity', 'gtag', 'dataLayer'].filter((g) => typeof window[g] !== 'undefined'),
              }));
              const reqs = seen.slice(before);
              if (!reqs.length && !state.scripts.length && !state.globals.length) pass(`${p}: 0 tracker requests, 0 tracker scripts, no fbq/clarity/gtag/dataLayer`);
              else bad(`${p}: requests ${JSON.stringify(reqs)} scripts ${JSON.stringify(state.scripts)} globals ${JSON.stringify(state.globals)}`);
            }
            pass(`first-party /api/analytics/track calls blocked (not written): ${trackBlocked}`);
            await ctx.close();

            // Admin funnel route: deployed and answering (auth redirect for an anonymous visitor), no 5xx.
            const r = await fetch(BASE + '/admin/analytics/funnel', { redirect: 'manual', headers: { 'User-Agent': UA } });
            const loc = r.headers.get('location') || '';
            if (r.status < 500 && r.status !== 404) pass(`/admin/analytics/funnel → ${r.status}${loc ? ` (${loc.replace(/\?.*$/, '')})` : ''}`);
            else bad(`/admin/analytics/funnel → ${r.status}`);
          } catch (e) {
            bad(`tracker check threw: ${e.message}`);
          } finally {
            await browser.close();
          }
          const fs = await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join('\n') + '\n');
          console.log(out.join('\n'));
          if (fail) process.exit(1);
          EOF
          node check.mjs

      - name: Auth pages and NextAuth endpoints answer normally (OL-231)
        if: ${{ inputs.check_auth }}
        shell: bash
        env:
          BASE: ${{ inputs.base }}
        run: |
          FAIL=0
          UA='CareLinkAI-ProdVerify/1.0 (+github-actions)'
          fail() { echo "::error::$1"; echo "- ❌ $1" >> "$GITHUB_STEP_SUMMARY"; FAIL=1; }
          pass() { echo "OK: $1"; echo "- ✅ $1" >> "$GITHUB_STEP_SUMMARY"; }
          echo "## Auth checks — $BASE" >> "$GITHUB_STEP_SUMMARY"
          for p in /auth/login /auth/register /auth/forgot-password; do
            code=$(curl -s -m 40 -o /dev/null -w '%{http_code}' -A "$UA" "$BASE$p" || echo 000)
            [ "$code" = "200" ] && pass "GET $p → 200" || fail "GET $p → $code"
          done
          code=$(curl -s -m 40 -o providers.json -w '%{http_code}' -A "$UA" "$BASE/api/auth/providers" || echo 000)
          if [ "$code" = "200" ] && jq -e '.credentials.id == "credentials"' providers.json >/dev/null 2>&1; then
            pass "GET /api/auth/providers → 200, providers: $(jq -r 'keys | join(", ")' providers.json)"
          else fail "GET /api/auth/providers → $code $(head -c 200 providers.json)"; fi
          rm -f jar.txt
          code=$(curl -s -m 40 -c jar.txt -b jar.txt -o csrf.json -w '%{http_code}' -A "$UA" "$BASE/api/auth/csrf" || echo 000)
          TOKEN=$(jq -r '.csrfToken // empty' csrf.json 2>/dev/null)
          if [ "$code" = "200" ] && [ ${#TOKEN} -ge 32 ]; then pass "GET /api/auth/csrf → 200, csrfToken present (${#TOKEN} chars, not printed)"
          else fail "GET /api/auth/csrf → $code (token length ${#TOKEN})"; fi
          # Unknown, reserved-TLD address: no account exists, nothing is written for an unknown user.
          code=$(curl -s -m 40 -c jar.txt -b jar.txt -o signin.txt -D signin-h.txt -w '%{http_code}' -A "$UA" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "csrfToken=$TOKEN" --data-urlencode 'email=prodverify-nobody@example.invalid' \
            --data-urlencode 'password=not-a-real-password' --data-urlencode 'json=true' \
            --data-urlencode "callbackUrl=$BASE/dashboard" \
            "$BASE/api/auth/callback/credentials" || echo 000)
          loc=$( { grep -i '^location:' signin-h.txt || true; } | head -n1 | sed -E 's/^[Ll]ocation:[[:space:]]*//; s/\r$//')
          url=$(jq -r '.url // empty' signin.txt 2>/dev/null)
          target="${url:-$loc}"
          if [ "${code:0:1}" = "5" ] || [ "$code" = "000" ]; then
            fail "POST /api/auth/callback/credentials (unknown email) → $code"
          elif echo "$target" | grep -q 'error='; then
            pass "POST /api/auth/callback/credentials (unknown email) → $code, failure redirect: ${target#$BASE} "
          else
            fail "POST /api/auth/callback/credentials (unknown email) → $code without an error redirect (target: ${target:-none})"
          fi
          [ "$FAIL" -eq 0 ] || exit 1

