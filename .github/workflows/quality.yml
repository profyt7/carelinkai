name: Quality

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: quality-${{ github.ref }}
  # A new push to a PR supersedes the run in flight; main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Docs-only PRs (Markdown, PDFs, docs/, context/) skip the heavy jobs;
          # anything else, and every non-PR event, runs them. A skipped job still
          # satisfies a required check; a workflow-level `paths:` filter would
          # leave it pending forever instead.
          if [ -z "$PR" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # If the file list can't be read, run everything rather than skip.
          if ! files=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename'); then
            echo "::warning::could not list PR files; running all jobs"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$files" | grep -qvE '^(docs/|context/)|\.(md|pdf)$'; then code=true; else code=false; fi
          echo "$(printf '%s\n' "$files" | grep -c .) changed file(s); code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  quality:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      actions: read
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: '1'
      S3_DISABLE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (including dev)
        run: npm ci --include=dev

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          # Source in the key so the cache is re-saved as the code changes; the
          # lockfile-only prefix restores the nearest previous build.
          key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.js') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-cache-${{ runner.os }}-

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --ci --reporters=default --forceExit --runInBand 2>&1 | tee jest.log

      - name: Upload Jest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jest-log
          path: jest.log

      - name: Build
        env:
          APP_VERSION: ${{ github.sha }}
        run: npm run build

      - name: Create/Update PR Quality Badge Comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: quality-status
          message: |
            ✅ Quality checks succeeded.

            ![Quality](https://github.com/${{ github.repository }}/actions/workflows/quality.yml/badge.svg?branch=${{ github.head_ref }})
