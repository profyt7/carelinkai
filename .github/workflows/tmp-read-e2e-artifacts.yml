name: tmp read e2e artifacts
# TEMPORARY (OL-153 diagnosis): this sandbox cannot download Actions artifacts
# (blob host blocked) and annotations are capped at 10 per step, so a runner
# collects the failed tests' error-context + trace errors of two main runs and
# posts them as ONE comment on PR #774. Removed before the PR is reviewed.
on:
  pull_request:
    paths: ['.github/workflows/tmp-read-e2e-artifacts.yml']
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Collect + comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          for spec in "39652136954 playwright-test-results-concierge" "39603169138 playwright-test-results-operator-claim"; do
            set -- $spec
            mkdir -p "art/$1" && gh run download "$1" -R profyt7/carelinkai -n "$2" -D "art/$1" || echo "no artifact $2 on run $1"
          done
          out=report.md
          echo "## tmp: failed-test artifacts (auto, to be deleted)" > $out
          for d in $(find art -maxdepth 3 -mindepth 2 -type d | sort); do
            echo "" >> $out; echo "### $d" >> $out; echo '```' >> $out; ls -s "$d" >> $out; echo '```' >> $out
            for z in "$d"/trace*.zip; do
              [ -f "$z" ] || continue
              rm -rf tr && mkdir tr && unzip -q -o "$z" -d tr
              echo "trace errors:" >> $out; echo '```' >> $out
              cat tr/*.trace 2>/dev/null | grep -o '"error":{"message":"[^"]\{0,500\}' | sed 's/"error":{"message":"//' | sort -u | head -6 >> $out
              echo '```' >> $out
            done
            [ -f "$d/error-context.md" ] && { echo "error-context.md (head):" >> $out; echo '```' >> $out; head -c 1500 "$d/error-context.md" >> $out; echo >> $out; echo '```' >> $out; }
          done
          wc -c $out
          gh pr comment 774 -R profyt7/carelinkai --body-file $out
