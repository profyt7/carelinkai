name: E2E (Residents + Family split)

on:
  push:
    # Not feat/**: an open PR already runs this via pull_request, so a feat/
    # push used to run every e2e job twice.
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "**" ]
    # Draft PRs skip e2e (job-level `if` below); marking the PR ready runs it.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    # Nightly at 06:00 UTC on default branch
    - cron: '0 6 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Password for every account the specs seed (/api/dev/upsert-*) or sign up.
  # Per run, never a literal in the repo; local throwaway DB only. Must pass the
  # signup rule: upper, lower, digit and one of @$!%*?&.
  DEMO_ACCOUNT_PASSWORD: Ci${{ github.run_id }}x${{ github.run_attempt }}!Aa

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Docs-only PRs (Markdown, PDFs, docs/, context/) skip the heavy jobs;
          # anything else, and every non-PR event, runs them. A skipped job still
          # satisfies a required check; a workflow-level `paths:` filter would
          # leave it pending forever instead.
          if [ -z "$PR" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # If the file list can't be read, run everything rather than skip.
          if ! files=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename'); then
            echo "::warning::could not list PR files; running all jobs"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$files" | grep -qvE '^(docs/|context/)|\.(md|pdf)$'; then code=true; else code=false; fi
          echo "$(printf '%s\n' "$files" | grep -c .) changed file(s); code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  e2e-residents:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carelinkai_marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # App runtime
      NODE_OPTIONS: --max-old-space-size=4096
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${{ secrets.E2E_NEXTAUTH_SECRET }}
      ALLOW_DEV_ENDPOINTS: "1"
      ALLOW_INSECURE_AUTH_COOKIE: "1"
      # Cache Playwright browsers to speed up CI
      # Absolute path (OL-195): YAML env does not expand `~`, so Playwright used to
      # install into ./~/.cache and the browser cache never saved.
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      # DB — MUST be the ephemeral `postgres` service container below, NEVER a
      # real/staging/prod database. The e2e jobs enable ALLOW_DEV_ENDPOINTS and
      # seed via /api/dev/* , so pointing this at prod writes test data into
      # production (this is exactly how 43 test homes leaked into prod). Do not
      # restore secrets.E2E_DATABASE_URL here.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carelinkai_marketplace?schema=public
      # S3 disabled in CI by default (mock URLs)
      S3_DISABLE: "1"
      # Disable Sentry in e2e — the app must not phone home from CI. The
      # committed .env carries a live SENTRY_DSN, so without these overrides the
      # build bakes it in and the runtime makes outbound calls that
      # ETIMEDOUT/ECONNRESET in CI's locked-down network, destabilizing the
      # server mid-test and flaking the longer flows (OL-121).
      SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (including dev)
        run: npm ci --include=dev

      - name: Get Playwright version
        id: pw-version
        shell: bash
        run: |
          v=$(npx playwright --version | awk '{print $2}')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          # Source in the key so the cache is re-saved as the code changes; the
          # lockfile-only prefix restores the nearest previous build.
          key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.js') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-cache-${{ runner.os }}-

      - name: Prepare database schema
        run: npx prisma migrate deploy

      - name: Build app
        run: npm run build

      # OL-195: every e2e config runs Chromium only, and the runner image already
      # has every library it needs (--with-deps only added fonts and upgrades).
      # So no apt: the Ubuntu mirrors stall from these runners. The browser comes
      # from Playwright's CDN and is cached above; on a hit this is a no-op.
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: |
          for attempt in 1 2; do
            npx playwright install chromium && exit 0
            echo "::warning::Playwright install attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1

      - name: Run Playwright (Residents core) (shard ${{ matrix.shard }}/2)
        env:
          # Run production server for stability; still enable dev endpoints and use CI DB/secret
          PLAYWRIGHT_WEB_SERVER_CMD: >-
            cross-env NEXTAUTH_URL=http://localhost:3000 NEXTAUTH_SECRET=$NEXTAUTH_SECRET 
            ALLOW_DEV_ENDPOINTS=1 ALLOW_INSECURE_AUTH_COOKIE=1 
            DATABASE_URL=$DATABASE_URL 
            npm run start
        run: |
          # OL-063 guard: discovery must be non-empty. A sharded run silently
          # passes when zero specs match (e.g. wrong testDir); `--list` (no
          # shard) instead exits 1 on an empty match, failing the job loudly.
          echo "Verifying Residents specs are discoverable (OL-063 guard)…"
          npx playwright test --config=playwright.e2e.config.ts \
            e2e/residents-transfer.spec.ts \
            e2e/residents-lifecycle.spec.ts \
            e2e/residents-summary.spec.ts \
            e2e/residents-contacts.spec.ts \
            e2e/residents-documents.spec.ts \
            e2e/residents-compliance.spec.ts \
            e2e/residents-csv-export.spec.ts \
            e2e/residents-assessments-incidents-edit.spec.ts \
            e2e/residents-assessments-incidents-update.spec.ts \
            --list
          # Run the full Residents suite against the ./e2e testDir config so the
          # specs actually execute (was: default config + testDir ./tests, which
          # discovered nothing and passed an empty shard — OL-063).
          npx playwright test --config=playwright.e2e.config.ts \
            e2e/residents-transfer.spec.ts \
            e2e/residents-lifecycle.spec.ts \
            e2e/residents-summary.spec.ts \
            e2e/residents-contacts.spec.ts \
            e2e/residents-documents.spec.ts \
            e2e/residents-compliance.spec.ts \
            e2e/residents-csv-export.spec.ts \
            e2e/residents-assessments-incidents-edit.spec.ts \
            e2e/residents-assessments-incidents-update.spec.ts \
            --workers=1 --shard=${{ matrix.shard }}/2 --reporter=line,blob --retries=1 --trace on --timeout=60000

      - name: Upload Playwright test artifacts (Residents shard ${{ matrix.shard }}) (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-residents-shard-${{ matrix.shard }}
          path: |
            test-results
            blob-report
          if-no-files-found: ignore
          retention-days: 7

  e2e-family:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carelinkai_marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # App runtime
      NODE_OPTIONS: --max-old-space-size=4096
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${{ secrets.E2E_NEXTAUTH_SECRET }}
      ALLOW_DEV_ENDPOINTS: "1"
      ALLOW_INSECURE_AUTH_COOKIE: "1"
      # Cache Playwright browsers to speed up CI
      # Absolute path (OL-195): YAML env does not expand `~`, so Playwright used to
      # install into ./~/.cache and the browser cache never saved.
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      # DB — MUST be the ephemeral `postgres` service container below, NEVER a
      # real/staging/prod database. The e2e jobs enable ALLOW_DEV_ENDPOINTS and
      # seed via /api/dev/* , so pointing this at prod writes test data into
      # production (this is exactly how 43 test homes leaked into prod). Do not
      # restore secrets.E2E_DATABASE_URL here.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carelinkai_marketplace?schema=public
      # S3 disabled in CI by default (mock URLs)
      S3_DISABLE: "1"
      # Disable Sentry in e2e — the app must not phone home from CI. The
      # committed .env carries a live SENTRY_DSN, so without these overrides the
      # build bakes it in and the runtime makes outbound calls that
      # ETIMEDOUT/ECONNRESET in CI's locked-down network, destabilizing the
      # server mid-test and flaking the longer flows (OL-121).
      SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (including dev)
        run: npm ci --include=dev

      - name: Get Playwright version
        id: pw-version
        shell: bash
        run: |
          v=$(npx playwright --version | awk '{print $2}')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          # Source in the key so the cache is re-saved as the code changes; the
          # lockfile-only prefix restores the nearest previous build.
          key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.js') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-cache-${{ runner.os }}-

      - name: Prepare database schema
        run: npx prisma migrate deploy

      - name: Build app
        run: npm run build

      # OL-195: every e2e config runs Chromium only, and the runner image already
      # has every library it needs (--with-deps only added fonts and upgrades).
      # So no apt: the Ubuntu mirrors stall from these runners. The browser comes
      # from Playwright's CDN and is cached above; on a hit this is a no-op.
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: |
          for attempt in 1 2; do
            npx playwright install chromium && exit 0
            echo "::warning::Playwright install attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1

      - name: Run Playwright (Family) (shard ${{ matrix.shard }}/2)
        env:
          # Use production server for stability; enable dev endpoints in CI
          PLAYWRIGHT_WEB_SERVER_CMD: >-
            cross-env NEXTAUTH_URL=http://localhost:3000 NEXTAUTH_SECRET=$NEXTAUTH_SECRET 
            ALLOW_DEV_ENDPOINTS=1 ALLOW_INSECURE_AUTH_COOKIE=1 
            DATABASE_URL=$DATABASE_URL 
            npm run start
        run: |
          # OL-063 guard: fail loudly if discovery is empty (a sharded run would
          # otherwise pass an empty shard). `--list` exits 1 when nothing matches.
          echo "Verifying Family specs are discoverable (OL-063 guard)…"
          npx playwright test --config=playwright.e2e.config.ts e2e/family-*.spec.ts --list
          # Run against the ./e2e testDir config so the specs actually execute
          # (was: default config + testDir ./tests → discovered nothing, passed
          # an empty shard — OL-063).
          npx playwright test --config=playwright.e2e.config.ts e2e/family-*.spec.ts --reporter=line,blob --retries=1 --trace retain-on-failure --shard=${{ matrix.shard }}/2 --timeout=60000

      - name: Upload Playwright test artifacts (Family shard ${{ matrix.shard }}) (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-family-shard-${{ matrix.shard }}
          path: |
            test-results
            blob-report
          if-no-files-found: ignore
          retention-days: 7

  e2e-operator-claim:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    # Cleveland founder claim-flow regression guard (run before founder outreach).
    # Scoped to the named operator-portal specs so it does not inherit any
    # staleness from the other (not-yet-CI-wired) operator-*/auth-*/marketplace-*
    # e2e specs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carelinkai_marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${{ secrets.E2E_NEXTAUTH_SECRET }}
      ALLOW_DEV_ENDPOINTS: "1"
      ALLOW_INSECURE_AUTH_COOKIE: "1"
      # Absolute path (OL-195): YAML env does not expand `~`, so Playwright used to
      # install into ./~/.cache and the browser cache never saved.
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      # Ephemeral service-container DB only — NEVER prod (see note in the other
      # e2e jobs). ALLOW_DEV_ENDPOINTS seeding must not reach a real database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carelinkai_marketplace?schema=public
      S3_DISABLE: "1"
      # Disable Sentry in e2e — see note in the residents/family jobs (OL-121).
      SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      # OL-190: the featured-listing spec needs the kill switch on (off by
      # default and in production). Stripe is never called by that spec.
      FEATURED_LISTING_ENABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (including dev)
        run: npm ci --include=dev

      - name: Get Playwright version
        id: pw-version
        shell: bash
        run: |
          v=$(npx playwright --version | awk '{print $2}')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          # Source in the key so the cache is re-saved as the code changes; the
          # lockfile-only prefix restores the nearest previous build.
          key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.js') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-cache-${{ runner.os }}-

      - name: Prepare database schema
        run: npx prisma migrate deploy

      - name: Build app
        run: npm run build

      # OL-195: every e2e config runs Chromium only, and the runner image already
      # has every library it needs (--with-deps only added fonts and upgrades).
      # So no apt: the Ubuntu mirrors stall from these runners. The browser comes
      # from Playwright's CDN and is cached above; on a hit this is a no-op.
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: |
          for attempt in 1 2; do
            npx playwright install chromium && exit 0
            echo "::warning::Playwright install attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1

      - name: Run Playwright (Operator claim flow)
        run: |
          # Uses playwright.e2e.config.ts (testDir: ./e2e) so the spec is actually
          # discovered — the default config's testDir is ./tests, which silently
          # matches nothing under ./e2e. webServer runs `npm run dev` and inherits
          # the job env (ALLOW_DEV_ENDPOINTS / ALLOW_INSECURE_AUTH_COOKIE / DB).
          # operator-availability-contact.spec.ts (W5-5): the operator portal's
          # availability-contact card → admin pings page lists the home as eligible.
          # operator-featured-listing.spec.ts (OL-190): standalone featured checkout + webhook fulfilment.
          npx playwright test --config=playwright.e2e.config.ts e2e/operator-claim-flow.spec.ts e2e/operator-availability-contact.spec.ts e2e/operator-featured-listing.spec.ts --workers=1 --reporter=line

      - name: Upload Playwright test artifacts (Operator claim flow) (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-operator-claim
          path: |
            test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e-concierge:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    # Discharge-planner concierge placement flow regression guard (PR #671) +
    # the /founder self-hosted intro page (DP-lane, no auth, no DB) + the
    # concierge / admin-heavy public specs (e2e/public/concierge/).
    # Self-seeds via /api/dev/* (ALLOW_DEV_ENDPOINTS=1).
    #
    # Split in the W5 follow-up: one dev server running all 81 public specs sat
    # at its memory ceiling (OL-146 residual restarts mid-test, 26–29 min runs).
    # The logged-out directory / SEO specs now run in e2e-public-directory.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carelinkai_marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 6 GB heap for THIS job only: it runs every e2e/public/ landing spec on
      # one dev server, and Next's dev memory watchdog restarts the server near
      # the heap limit mid-test (OL-146 — "approaching the used memory threshold").
      NODE_OPTIONS: --max-old-space-size=6144
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${{ secrets.E2E_NEXTAUTH_SECRET }}
      ALLOW_DEV_ENDPOINTS: "1"
      ALLOW_INSECURE_AUTH_COOKIE: "1"
      # Absolute path (OL-195): YAML env does not expand `~`, so Playwright used to
      # install into ./~/.cache and the browser cache never saved.
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      # Ephemeral service-container DB only — NEVER prod (see note in the other
      # e2e jobs). ALLOW_DEV_ENDPOINTS seeding must not reach a real database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carelinkai_marketplace?schema=public
      S3_DISABLE: "1"
      # Disable Sentry in e2e — see note in the residents/family jobs (OL-121).
      SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      # Sprint W4-1 one-tap availability ping: the cron is CRON_SECRET-gated
      # (fail closed) and PING_ENABLED-gated; both are set here ONLY so the e2e
      # can drive ping → reply → Verified. No RESEND_API_KEY → nothing is sent.
      CRON_SECRET: e2e-cron-secret
      PING_ENABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (including dev)
        run: npm ci --include=dev

      - name: Get Playwright version
        id: pw-version
        shell: bash
        run: |
          v=$(npx playwright --version | awk '{print $2}')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          # Source in the key so the cache is re-saved as the code changes; the
          # lockfile-only prefix restores the nearest previous build.
          key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.js') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-cache-${{ runner.os }}-

      - name: Prepare database schema
        run: npx prisma migrate deploy

      - name: Build app
        run: npm run build

      # OL-195: every e2e config runs Chromium only, and the runner image already
      # has every library it needs (--with-deps only added fonts and upgrades).
      # So no apt: the Ubuntu mirrors stall from these runners. The browser comes
      # from Playwright's CDN and is cached above; on a hit this is a no-op.
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: |
          for attempt in 1 2; do
            npx playwright install chromium && exit 0
            echo "::warning::Playwright install attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1

      # OL-153: this job used to run its 80+ specs against one shared `next dev`
      # server, whose memory watchdog restarted it mid-run (ECONNREFUSED /
      # ECONNRESET on whichever spec was in flight — red on main, green on a
      # retry). The build above already exists, so the specs now run against
      # the production standalone server: no lazy compiles, no restarts.
      - name: Assemble the standalone server (static assets + public)
        run: |
          test -f .next/standalone/server.js
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next && cp -r .next/static .next/standalone/.next/static

      - name: Run Playwright (DP concierge flow + /founder intro page + concierge public specs)
        env:
          E2E_WEB_SERVER: node .next/standalone/server.js
          PORT: "3000"
        run: |
          # Bind dual-stack where the runner has IPv6 so both ::1 and 127.0.0.1
          # answer for "localhost" (Node resolved it to ::1 in the failing runs).
          export HOSTNAME=$([ -e /proc/net/if_inet6 ] && echo '::' || echo '0.0.0.0')
          # founder-page.spec.ts: the self-hosted founder intro linked from the DP
          # follow-up emails must serve 200 unauthenticated with the local <video>.
          # e2e/public/concierge/: the concierge offer / paid lane, facility
          # accept-decline, Medicaid waiver acceptance, History and concierge
          # metrics specs (admin-heavy pages). New specs dropped in that folder
          # run here without editing this line. The github reporter annotates
          # each failing test on the check run (the job log is not always reachable).
          npx playwright test --config=playwright.e2e.config.ts e2e/concierge-flow.spec.ts e2e/founder-page.spec.ts e2e/public/concierge/ --workers=1 --reporter=line,github

      - name: Upload Playwright test artifacts (Concierge flow) (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-concierge
          path: |
            test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e-public-directory:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    # Logged-out directory / SEO regression guard (split out of e2e-concierge in
    # the W5 follow-up so neither dev server sits at its memory ceiling):
    # public routes, demo filter, agency cohort, availability ping, claim
    # re-send list, Cleveland listings, structured data, suburb pages.
    # Self-seeds via /api/dev/* (ALLOW_DEV_ENDPOINTS=1).
    # OL-211: runs against the production standalone build (as e2e-concierge,
    # OL-153), never `next dev`.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carelinkai_marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 6 GB heap for THIS job only (OL-146). Since OL-211 the specs no longer
      # run on `next dev`; the heap now mainly serves `npm run build`.
      NODE_OPTIONS: --max-old-space-size=6144
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${{ secrets.E2E_NEXTAUTH_SECRET }}
      ALLOW_DEV_ENDPOINTS: "1"
      ALLOW_INSECURE_AUTH_COOKIE: "1"
      # Absolute path (OL-195): YAML env does not expand `~`, so Playwright used to
      # install into ./~/.cache and the browser cache never saved.
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      # Ephemeral service-container DB only — NEVER prod (see note in the other
      # e2e jobs). ALLOW_DEV_ENDPOINTS seeding must not reach a real database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carelinkai_marketplace?schema=public
      S3_DISABLE: "1"
      # Disable Sentry in e2e — see note in the residents/family jobs (OL-121).
      SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      # OL-178: a FAKE MapTiler key so the listing map builds its MapTiler tile
      # URLs; listing-map-tiles.spec.ts intercepts api.maptiler.com (no real
      # request leaves the runner) and asserts no OSM / CARTO tile request.
      NEXT_PUBLIC_MAPTILER_KEY: e2e-fake-maptiler-key
      # Sprint W4-1 one-tap availability ping: the cron is CRON_SECRET-gated
      # (fail closed) and PING_ENABLED-gated; both are set here ONLY so the e2e
      # can drive ping → reply → Verified. No RESEND_API_KEY → nothing is sent.
      CRON_SECRET: e2e-cron-secret
      PING_ENABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (including dev)
        run: npm ci --include=dev

      - name: Get Playwright version
        id: pw-version
        shell: bash
        run: |
          v=$(npx playwright --version | awk '{print $2}')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          # Source in the key so the cache is re-saved as the code changes; the
          # lockfile-only prefix restores the nearest previous build.
          key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.js') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-cache-${{ runner.os }}-

      - name: Prepare database schema
        run: npx prisma migrate deploy

      - name: Build app
        run: npm run build

      # OL-195: every e2e config runs Chromium only, and the runner image already
      # has every library it needs (--with-deps only added fonts and upgrades).
      # So no apt: the Ubuntu mirrors stall from these runners. The browser comes
      # from Playwright's CDN and is cached above; on a hit this is a no-op.
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: |
          for attempt in 1 2; do
            npx playwright install chromium && exit 0
            echo "::warning::Playwright install attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1

      # OL-211: same as e2e-concierge (OL-153). The shared `next dev` server
      # compiled routes on first hit and restarted near its heap limit, so
      # whichever spec was in flight got a timeout / ECONNRESET / socket hang up
      # (role-navigation, cleveland-listings, seo-pass). The specs now run
      # against the production standalone server built above: no lazy
      # compiles, no dev restarts. Migrations are the step above (local
      # postgres service), not `npm start`'s migrate:deploy.
      - name: Assemble the standalone server (static assets + public)
        run: |
          test -f .next/standalone/server.js
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next && cp -r .next/static .next/standalone/.next/static

      - name: Run Playwright (public routes + directory / SEO specs)
        env:
          E2E_WEB_SERVER: node .next/standalone/server.js
          PORT: "3000"
        run: |
          # Bind dual-stack where the runner has IPv6 (same as e2e-concierge).
          export HOSTNAME=$([ -e /proc/net/if_inet6 ] && echo '::' || echo '0.0.0.0')
          # public-routes.spec.ts: the five sitemap landing pages (/cleveland/*) must
          # answer 200 logged-out with no noindex; unknown paths 404, not login.
          # search-demo-filter.spec.ts: demo/tutorial homes never surface in the
          # public directory APIs / page for a logged-out visitor (OL-112).
          # e2e/public/directory/: every logged-out SEO / landing-page spec (agency
          # cohort, suburb pages, structured data, availability ping …). New specs
          # dropped in that folder run here without editing this line.
          # role-navigation.spec.ts (OL-206): per-role sidebar / bottom bar for all 8 roles.
          npx playwright test --config=playwright.e2e.config.ts e2e/public-routes.spec.ts e2e/search-demo-filter.spec.ts e2e/search-availability-labels.spec.ts e2e/design-preview-direction-d.spec.ts e2e/role-navigation.spec.ts e2e/public/directory/ --workers=1 --reporter=line

      - name: Upload Playwright test artifacts (Public directory) (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-public-directory
          path: |
            test-results
          if-no-files-found: ignore
          retention-days: 7

