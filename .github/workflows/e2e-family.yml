      # So no apt: the Ubuntu mirrors stall from these runners. The browser comes
      # from Playwright's CDN and is cached above; on a hit this is a no-op.
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: |
          for attempt in 1 2; do
            npx playwright install chromium && exit 0
            echo "::warning::Playwright install attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1

      - name: Run Playwright (signup verify-email UX)
        run: |
          # OL-063 guard: a path that matches no tests must fail loudly, not pass an
          # empty run. `--list` exits non-zero if the spec isn't discovered.
          npx playwright test --config=playwright.e2e.config.ts e2e/auth-signup-verify.spec.ts --list
          npx playwright test --config=playwright.e2e.config.ts e2e/auth-signup-verify.spec.ts --workers=1 --reporter=line

      - name: Upload Playwright test artifacts (signup verify) (always)
