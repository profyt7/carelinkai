name: Prod Probe (security fixes, signed-in)

# Confirms the P0 security fixes against PRODUCTION with two signed-in, synthetic FAMILY test accounts.
# Read-only by design: it never creates inquiries, documents, messages or anything that notifies a third party.
# The only writes it can cause are each probe account's own Family/FamilyMember row (GET /api/family/membership
# self-provisions the caller's own family). Output is status codes and counts only — never response data.
#
# Secrets (create the accounts in production first, synthetic data only):
#   PROD_PROBE_A_EMAIL / PROD_PROBE_A_PASSWORD   — FAMILY account A
#   PROD_PROBE_B_EMAIL / PROD_PROBE_B_PASSWORD   — FAMILY account B
# Probes that need an account report SKIP when its secrets are missing; unauthenticated probes always run.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to probe'
        default: 'https://getcarelinkai.com'
        required: true
      probes:
        description: 'Comma list: p0-1,p0-2,p0-3,p0-4,p0-5,p0-6,p0-7,2fa-enforce,logout-others (or "all")'
        default: 'all'
        required: true
      claim_home_ids:
        description: 'ONE-OFF (branch only): comma-separated home ids for claim-precheck'
        default: ''
        required: false
      claim_urls:
        description: 'ONE-OFF (branch only): space-separated /auth/register?…claimToken=… URLs for claim-urls'
        default: ''
        required: false

permissions:
  contents: read

jobs:
  probe:
    name: Probe production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run probes
        env:
          BASE: ${{ inputs.base_url }}
          PROBES: ${{ inputs.probes }}
          CLAIM_HOME_IDS: ${{ inputs.claim_home_ids }}
          CLAIM_URLS: ${{ inputs.claim_urls }}
          A_EMAIL: ${{ secrets.PROD_PROBE_A_EMAIL }}
          A_PASSWORD: ${{ secrets.PROD_PROBE_A_PASSWORD }}
          B_EMAIL: ${{ secrets.PROD_PROBE_B_EMAIL }}
          B_PASSWORD: ${{ secrets.PROD_PROBE_B_PASSWORD }}
          TFA_EMAIL: ${{ secrets.PROD_PROBE_2FA_EMAIL }}
          TFA_PASSWORD: ${{ secrets.PROD_PROBE_2FA_PASSWORD }}
          # Synthetic ADMIN/STAFF/OPERATOR/DISCHARGE_PLANNER account that has NOT set up 2FA
          # (never enrol it: the probe checks the forced-setup gate on every run).
          PRIV_EMAIL: ${{ secrets.PROD_PROBE_PRIV_EMAIL }}
          PRIV_PASSWORD: ${{ secrets.PROD_PROBE_PRIV_PASSWORD }}
        run: |
          cat > probe.mjs <<'EOF'
          const BASE = process.env.BASE.replace(/\/$/, '');
          const want = new Set((process.env.PROBES || 'all').split(',').map((s) => s.trim()));
          const on = (p) => want.has('all') || want.has(p);
          const results = [];
          const record = (probe, status, detail) => { results.push({ probe, status, detail }); console.log(`${status.padEnd(4)} ${probe}: ${detail}`); };

          // Minimal cookie jar per account.
          function jar() {
            const c = new Map();
            return {
              header: () => [...c].map(([k, v]) => `${k}=${v}`).join('; '),
              take: (res) => { for (const sc of res.headers.getSetCookie?.() ?? []) { const [kv] = sc.split(';'); const i = kv.indexOf('='); c.set(kv.slice(0, i).trim(), kv.slice(i + 1)); } },
              has: (name) => [...c.keys()].some((k) => k.includes(name)),
            };
          }
          async function req(j, path, init = {}) {
            const res = await fetch(BASE + path, { ...init, redirect: 'manual', headers: { ...(init.headers || {}), ...(j ? { cookie: j.header() } : {}) } });
            if (j) j.take(res);
            return res;
          }
          // NextAuth answers a json=true credentials POST with { url }, so a sign-in error is the
          // `error` query param of that url (a Location header only without json=true).
          async function callbackError(res) {
            let url = res.headers.get('location') || '';
            try { url = (await res.json()).url || url; } catch {}
            return (decodeURIComponent(url).match(/[?&]error=([^&]+)/) || [])[1] || '';
          }
          async function signIn(email, password) {
            if (!email || !password) return null;
            const j = jar();
            const csrf = await (await req(j, '/api/auth/csrf')).json();
            const body = new URLSearchParams({ csrfToken: csrf.csrfToken, email, password, callbackUrl: BASE + '/dashboard', json: 'true' });
            const r = await req(j, '/api/auth/callback/credentials', { method: 'POST', headers: { 'content-type': 'application/x-www-form-urlencoded' }, body });
            const err = await callbackError(r);
            const session = await (await req(j, '/api/auth/session')).json().catch(() => ({}));
            if (!session?.user) throw new Error(`sign-in failed for probe account (${email.replace(/(.).*@/, '$1***@')}): ${err || 'no error given'}`);
            return j;
          }
          const count = (x) => (Array.isArray(x) ? x.length : x && typeof x === 'object' ? Object.keys(x).length : 0);

          const A = await signIn(process.env.A_EMAIL, process.env.A_PASSWORD).catch((e) => { record('sign-in A', 'FAIL', e.message); return null; });
          const B = await signIn(process.env.B_EMAIL, process.env.B_PASSWORD).catch((e) => { record('sign-in B', 'FAIL', e.message); return null; });
          const needA = (p) => { if (!A) { record(p, 'SKIP', 'PROD_PROBE_A_* secrets not set'); return false; } return true; };

          // P0-1: a FAMILY caller is refused by the convert endpoint before any lookup (pre-fix: 404 for an unknown id, 200 for a real one).
          if (on('p0-1') && needA('p0-1')) {
            const r = await req(A, '/api/operator/inquiries/probe-nonexistent-id/convert');
            record('p0-1', r.status === 403 ? 'PASS' : 'FAIL', `family GET convert → ${r.status} (want 403)`);
          }

          // P0-3: A cannot read B's family, and is not auto-added (a second call is still refused).
          if (on('p0-3')) {
            if (!A || !B) record('p0-3', 'SKIP', 'needs both probe accounts');
            else {
              const fam = await (await req(B, '/api/family/membership')).json().catch(() => ({}));
              if (!fam.familyId) record('p0-3', 'FAIL', 'could not resolve probe B family id');
              else {
                const r1 = await req(A, `/api/family/notes?familyId=${encodeURIComponent(fam.familyId)}`);
                const r2 = await req(A, `/api/family/emergency?familyId=${encodeURIComponent(fam.familyId)}`);
                const r3 = await req(A, `/api/family/notes?familyId=${encodeURIComponent(fam.familyId)}`);
                const ok = [r1, r2, r3].every((r) => r.status === 403);
                record('p0-3', ok ? 'PASS' : 'FAIL', `A on B's family: notes ${r1.status}, emergency ${r2.status}, notes again ${r3.status} (want 403 ×3)`);
              }
            }
          }

          // P0-4: a FAMILY with no linked residents gets nothing (pre-fix: every resident), JSON and CSV.
          if (on('p0-4') && needA('p0-4')) {
            const j = await req(A, '/api/residents');
            const items = j.status === 200 ? count((await j.json()).items) : -1;
            const c = await req(A, '/api/residents?format=csv');
            const ctype = c.headers.get('content-type') || '';
            let rows = -1;
            if (c.status === 200 && ctype.includes('csv')) rows = Math.max(0, (await c.text()).trim().split('\n').length - 1);
            else if (c.status === 200) rows = count((await c.json()).items);
            const ok = items === 0 && rows === 0;
            record('p0-4', ok ? 'PASS' : 'FAIL', `family residents JSON items=${items}, CSV rows=${rows} (want 0, 0)`);
          }

          // P0-5: a FAMILY sees no documents it doesn't own (pre-fix: every document).
          if (on('p0-5') && needA('p0-5')) {
            const r = await req(A, '/api/documents');
            let n = -1;
            if (r.status === 200) n = count((await r.json()).documents);
            const ok = r.status === 403 || n === 0;
            record('p0-5', ok ? 'PASS' : 'FAIL', `family GET /api/documents → ${r.status}, documents=${n} (want 403 or 0)`);
          }

          // P0-6: dashboards/reports are not platform-wide for a FAMILY caller.
          // P0-6: a FAMILY caller's dashboards are scoped to its own residents (200, zero counts for
          // the probe family, which has none — never platform-wide); operator dashboard and report
          // generation refuse it.
          if (on('p0-6') && needA('p0-6')) {
            const st = [];
            for (const p of ['/api/dashboard/activity', '/api/dashboard/alerts', '/api/dashboard/charts']) st.push(`${p.split('/').pop()}=${(await req(A, p)).status}`);
            const mRes = await req(A, '/api/dashboard/metrics');
            const m = await mRes.json().catch(() => ({}));
            const residents = m?.totalResidents?.value, caregivers = m?.activeCaregivers?.value;
            const op = await req(A, '/api/operator/dashboard');
            const rep = await req(A, '/api/reports/generate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ type: 'RESIDENT_CENSUS', title: 'probe', format: 'CSV', homeIds: [] }) });
            const ok = mRes.status === 200 && residents === 0 && caregivers === 0 && st.every((x) => /=(200|401|403)$/.test(x)) && op.status === 403 && [401, 403].includes(rep.status);
            record('p0-6', ok ? 'PASS' : 'FAIL', `family: metrics ${mRes.status} residents=${residents} caregivers=${caregivers}, ${st.join(', ')}, operator/dashboard=${op.status}, reports/generate=${rep.status} (want 200 with 0/0, operator 403, reports 401/403)`);
          }

          // P0-7: unsigned Twilio webhooks are rejected (no account needed).
          if (on('p0-7')) {
            const form = { method: 'POST', headers: { 'content-type': 'application/x-www-form-urlencoded' }, body: 'Digits=2&MessageSid=probe&Body=NO&From=%2B15555550100' };
            const s = [];
            for (const p of ['/api/webhooks/twilio/voice/accept?attemptId=probe', '/api/webhooks/twilio/voice?attemptId=probe', '/api/webhooks/twilio/sms', '/api/webhooks/twilio/status']) s.push(`${p.split('?')[0].split('/').pop()}=${(await req(null, p, form)).status}`);
            // 503 = TWILIO_AUTH_TOKEN unset in prod (fails closed, still safe) — flagged so it gets set.
            const ok = s.every((x) => /=(403|503)$/.test(x));
            const noToken = s.some((x) => /=503$/.test(x));
            record('p0-7', ok ? 'PASS' : 'FAIL', `unsigned: ${s.join(', ')} (want 403; 503 = token unset, set TWILIO_AUTH_TOKEN)${noToken ? ' WARN token unset' : ''}`);
          }

          // P0-2: a 2FA-enrolled account's correct password ALONE must not produce a session.
          if (on('p0-2')) {
            if (!process.env.TFA_EMAIL || !process.env.TFA_PASSWORD) record('p0-2', 'SKIP', 'PROD_PROBE_2FA_* secrets not set');
            else {
              const j = jar();
              const csrf = await (await req(j, '/api/auth/csrf')).json();
              const body = new URLSearchParams({ csrfToken: csrf.csrfToken, email: process.env.TFA_EMAIL, password: process.env.TFA_PASSWORD, callbackUrl: BASE + '/dashboard', json: 'true' });
              const r = await req(j, '/api/auth/callback/credentials', { method: 'POST', headers: { 'content-type': 'application/x-www-form-urlencoded' }, body });
              const err = await callbackError(r);
              const session = await (await req(j, '/api/auth/session')).json().catch(() => ({}));
              const ok = !session?.user && err === 'TWO_FACTOR_REQUIRED';
              record('p0-2', ok ? 'PASS' : 'FAIL', `password only → session ${session?.user ? 'ISSUED' : 'none'}, error=${err || 'none'} (want none + TWO_FACTOR_REQUIRED)`);
            }
          }

          // 2FA enforcement: a privileged account without 2FA, checked on a PHI route (not just the
          // login redirect). ADMIN / STAFF: hard gate — every API outside /api/auth/* answers 403
          // TWO_FACTOR_SETUP_REQUIRED. OPERATOR / DISCHARGE_PLANNER: step-up — signed in and a non-PHI
          // API works, but the PHI route answers 403 TWO_FACTOR_STEP_UP_REQUIRED and a PHI page goes
          // to /auth/setup-2fa?callbackUrl=<that page>. Status codes and the error code only.
          if (on('2fa-enforce')) {
            const P = await signIn(process.env.PRIV_EMAIL, process.env.PRIV_PASSWORD).catch((e) => { record('2fa-enforce', 'FAIL', e.message); return undefined; });
            if (P === null) record('2fa-enforce', 'SKIP', 'PROD_PROBE_PRIV_* secrets not set');
            else if (P) {
              const s = await (await req(P, '/api/auth/session')).json().catch(() => ({}));
              const role = s?.user?.role;
              const dp = role === 'DISCHARGE_PLANNER';
              const phiApi = dp ? '/api/discharge-planner/requests' : '/api/residents';
              const phiPage = dp ? '/discharge-planner/requests' : '/operator/residents';
              const phi = await req(P, phiApi);
              const code = (await phi.json().catch(() => ({})))?.error;
              const page = await req(P, phiPage);
              const loc = page.headers.get('location') || '';
              const toSetup = page.status === 307 && loc.includes('/auth/setup-2fa') && decodeURIComponent(loc).includes(`callbackUrl=${phiPage}`);
              const setupApi = await req(P, '/api/auth/session');
              let ok, want;
              if (role === 'ADMIN' || role === 'STAFF') {
                ok = s?.user?.twoFactorSetupRequired === true && phi.status === 403 && code === 'TWO_FACTOR_SETUP_REQUIRED' && setupApi.status === 200;
                want = 'hard gate: setupRequired=true, PHI API 403 TWO_FACTOR_SETUP_REQUIRED, /api/auth/session 200';
              } else {
                const open = await req(P, '/api/profile/account'); // non-PHI: must work without 2FA
                ok = s?.user?.twoFactorStepUpRequired === true && s?.user?.twoFactorSetupRequired !== true && phi.status === 403 && code === 'TWO_FACTOR_STEP_UP_REQUIRED' && toSetup && open.status === 200;
                want = `step-up: stepUpRequired=true, ${phiApi} 403 TWO_FACTOR_STEP_UP_REQUIRED, ${phiPage} 307 → setup?callbackUrl, /api/profile/account 200 (got ${open.status})`;
              }
              record('2fa-enforce', ok ? 'PASS' : 'FAIL', `role=${role} setupRequired=${s?.user?.twoFactorSetupRequired} stepUpRequired=${s?.user?.twoFactorStepUpRequired} ${phiApi} → ${phi.status} ${code}, ${phiPage} → ${page.status} ${loc.replace(BASE, '').split('?')[0]} (want ${want})`);
            }
          }

          // "Log Out From All Other Devices" (#72/#73): two fresh sessions of probe A; signing
          // out the others from one ends the second, the first keeps working. Runs last
          // because it signs out every other session of account A.
          if (on('logout-others')) {
            if (!process.env.A_EMAIL || !process.env.A_PASSWORD) record('logout-others', 'SKIP', 'PROD_PROBE_A_* secrets not set');
            else {
              const one = await signIn(process.env.A_EMAIL, process.env.A_PASSWORD);
              const two = await signIn(process.env.A_EMAIL, process.env.A_PASSWORD);
              const r = await req(one, '/api/profile/sessions', { method: 'DELETE' });
              const s1 = await (await req(one, '/api/auth/session')).json().catch(() => ({}));
              const s2 = await (await req(two, '/api/auth/session')).json().catch(() => ({}));
              const api2 = await req(two, '/api/profile/account');
              const ok = r.status === 200 && !!s1?.user && !s2?.user && api2.status === 401;
              record('logout-others', ok ? 'PASS' : 'FAIL', `DELETE /api/profile/sessions → ${r.status}; this device ${s1?.user ? 'signed in' : 'SIGNED OUT'}; other device ${s2?.user ? 'STILL SIGNED IN' : 'signed out'}, its API → ${api2.status} (want 200, signed in, signed out, 401)`);
            }
          }

          // ONE-OFF, BRANCH ONLY (never merged), opt-in by name ('all' never runs these). Logged-out
          // GETs only — never submits or completes a claim, never opens /claim (that page records a visit).
          const homeInfo = async (id) => {
            const r = await fetch(`${BASE}/api/homes/${encodeURIComponent(id)}`, { redirect: 'manual' });
            const j = await r.json().catch(() => ({}));
            const h = j?.home ?? j?.data ?? j;
            return { status: r.status, name: h?.name, unclaimed: h?.unclaimed, address: h?.address };
          };
          const pageTitle = async (path) => {
            const r = await fetch(`${BASE}${path}`, { redirect: 'manual' });
            const html = await r.text().catch(() => '');
            return { status: r.status, title: ((html.match(/<title[^>]*>([^<]*)<\/title>/i) || [])[1] || '').trim() };
          };
          if (want.has('claim-precheck')) {
            for (const id of (process.env.CLAIM_HOME_IDS || '').split(',').map((x) => x.trim()).filter(Boolean)) {
              const h = await homeInfo(id);
              const t = await pageTitle(`/homes/${id}`);
              const a = h.address || {};
              record('claim-precheck', h.status === 200 && h.unclaimed === true ? 'PASS' : 'FAIL',
                `${id} → API ${h.status} name="${h.name}" unclaimed=${h.unclaimed} address="${[a.street, a.city, a.state, a.zipCode].filter(Boolean).join(', ')}" | page ${t.status} title="${t.title}"`);
            }
          }
          if (want.has('claim-urls')) {
            const mask = (e) => String(e || '').replace(/^(.).*(@.*)$/, '$1***$2');
            for (const u of (process.env.CLAIM_URLS || '').split(/\s+/).filter(Boolean)) {
              let url;
              try { url = new URL(u); } catch { record('claim-urls', 'FAIL', `not a URL: ${u.slice(0, 60)}`); continue; }
              const token = url.searchParams.get('claimToken');
              if (url.origin !== new URL(BASE).origin || url.pathname !== '/auth/register' || !token) {
                record('claim-urls', 'FAIL', `refused (only ${BASE}/auth/register?claimToken=… — /claim records a visit): ${url.pathname}`);
                continue;
              }
              let p = null;
              try { p = JSON.parse(Buffer.from(token.split('.')[0], 'base64url').toString('utf8')); } catch {}
              const page = await fetch(url.toString(), { redirect: 'manual' });
              const h = p?.homeId ? await homeInfo(p.homeId) : {};
              const now = Math.floor(Date.now() / 1000);
              const exp = p?.exp ? new Date(p.exp * 1000).toISOString() : '?';
              const ok = page.status === 200 && !!p?.homeId && p.exp > now && h.status === 200 && h.unclaimed === true && token.split('.').length === 2;
              record('claim-urls', ok ? 'PASS' : 'FAIL',
                `GET /auth/register → ${page.status}; token homeId=${p?.homeId} → "${h.name}" (API ${h.status}, unclaimed=${h.unclaimed}); to=${mask(p?.operatorEmail)}; expires ${exp} (${p?.exp > now ? `${Math.round((p.exp - now) / 86400)} days left` : 'EXPIRED'}); founder=${p?.clevelandFounder}`);
            }
          }

          const failed = results.filter((r) => r.status === 'FAIL');
          console.log(`\n${results.length} probes: ${results.filter((r) => r.status === 'PASS').length} pass, ${failed.length} fail, ${results.filter((r) => r.status === 'SKIP').length} skip`);
          if (failed.length) process.exit(1);
          EOF
          node probe.mjs
