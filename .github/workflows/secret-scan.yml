name: Secret scan

# Fails the build when a credential is committed (OL-149). Two passes:
#   1. the checked-out tree — every file present at HEAD, so a key that is
#      already committed (in a .env, a template, a doc) keeps failing until it
#      is removed from the tree;
#   2. on pull requests, the PR's own commits — so a key that is committed and
#      then deleted in a later commit of the same PR is still caught before the
#      history reaches main.
# Secrets are redacted from all output (--redact=100): the log names the file,
# line and rule only. Rules + allowlist: .gitleaks.toml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.24.3
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - name: Checkout (full history for the PR-range pass)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan the checked-out tree (every file at HEAD)
        run: |
          set -euo pipefail
          /tmp/gitleaks dir . \
            --config .gitleaks.toml \
            --redact=100 \
            --no-banner \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks-tree.sarif

      - name: Scan this PR's commits
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          /tmp/gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact=100 \
            --no-banner \
            --exit-code 1

      - name: Upload SARIF report (redacted) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-tree.sarif
          if-no-files-found: ignore
