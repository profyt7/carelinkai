services:
  - type: web
    name: carelinkai
    runtime: node
    region: oregon
    plan: starter
    buildCommand: bash render-build-verbose.sh
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.11.0"
      - key: NODE_ENV
        value: production
    healthCheckPath: /

  # ---------------------------------------------------------------------------
  # Cron jobs (they exist in Render; declared here after the 2026-10-28 repo switch
  # wiped their env vars). Every cron gets DATABASE_URL from carelinkai-db and
  # CRON_SECRET from the carelinkai-shared group. Every other name is sync: false:
  # Render prompts for a value and never overwrites one already set. No values here.
  # VERIFY before merging: name, schedule and start command must match each
  # service's current Render settings (see the PR body).
  # ---------------------------------------------------------------------------
  - type: cron
    name: reminders-processor
    runtime: node
    region: oregon
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: echo no-build-needed
    startCommand: node scripts/run-cron.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carelinkai-db
          property: connectionString
      - fromGroup: carelinkai-shared
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: ADMIN_NOTIFY_MOBILE
        sync: false
      - key: CALENDAR_USE_MOCKS
        sync: false
      - key: CLAIM_NOTIFY_CC
        sync: false
      - key: CLAIM_NOTIFY_EMAIL
        sync: false
      - key: CRON_MAX_PER_RUN
        sync: false
      - key: CRON_WINDOW_MINUTES
        sync: false
      - key: DP_LEAD_FROM_EMAIL
        sync: false
      - key: DP_LEAD_FROM_NAME
        sync: false
      - key: DP_LEAD_REPLY_TO
        sync: false
      - key: DP_PLACEMENTS_PHONE
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NODE_ENV
        sync: false
      - key: OUTREACH_REPLY_TO
        sync: false
      - key: RESEND_API_KEY
        sync: false

  - type: cron
    name: oncall-wave-dispatch
    runtime: node
    region: oregon
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: echo no-build-needed
    startCommand: 'curl -fsS -X POST -H "x-cron-secret: $CRON_SECRET" https://getcarelinkai.com/api/cron/oncall-waves'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carelinkai-db
          property: connectionString
      - fromGroup: carelinkai-shared
      - key: ADMIN_NOTIFY_MOBILE
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_ENV
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

  - type: cron
    name: credential-expiry-check
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 6 * * *"
    buildCommand: echo no-build-needed
    startCommand: 'curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://getcarelinkai.com/api/cron/credential-expiry'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carelinkai-db
          property: connectionString
      - fromGroup: carelinkai-shared
      - key: EMAIL_FROM
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_ENV
        sync: false
      - key: RESEND_API_KEY
        sync: false

  - type: cron
    name: ride-reminders
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 * * * *"
    buildCommand: echo no-build-needed
    startCommand: 'curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://getcarelinkai.com/api/cron/ride-reminders'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carelinkai-db
          property: connectionString
      - fromGroup: carelinkai-shared
      - key: EMAIL_FROM
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_ENV
        sync: false
      - key: RESEND_API_KEY
        sync: false

  - type: cron
    name: monthly-reset-cron
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 0 1 * *"
    buildCommand: echo no-build-needed
    startCommand: 'curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://getcarelinkai.com/api/cron/reset-application-counts'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carelinkai-db
          property: connectionString
      - fromGroup: carelinkai-shared
      - key: NODE_ENV
        sync: false

  - type: cron
    name: tour-reminder
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 * * * *"
    buildCommand: echo no-build-needed
    startCommand: 'curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://getcarelinkai.com/api/cron/tour-reminders'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carelinkai-db
          property: connectionString
      - fromGroup: carelinkai-shared
      - key: ADMIN_NOTIFY_MOBILE
        sync: false
      - key: NODE_ENV
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

  - type: cron
    name: recurring-rides
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 7 * * *"
    buildCommand: echo no-build-needed
    startCommand: 'curl -fsS -H "x-cron-secret: $CRON_SECRET" https://getcarelinkai.com/api/cron/recurring-rides'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carelinkai-db
          property: connectionString
      - fromGroup: carelinkai-shared
      - key: NODE_ENV
        sync: false

envVarGroups:
  - name: carelinkai-shared
    envVars:
      - key: CRON_SECRET
        sync: false

